# The captured outputs of the tools (help_*, terminal_output_*) are
# generated, they are not modified by the hooks
exclude: ^tools/.*/files/(help_|terminal_output_)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # keep the hard line breaks of Markdown
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=3000]
      - id: check-merge-conflict
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
